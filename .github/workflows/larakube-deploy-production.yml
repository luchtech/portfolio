name: LaraKube Cloud Pilot (Deploy to production)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY_HOST: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REGISTRY_PROVIDER: ghcr



jobs:
  build:
    name: 🔨 Audit, Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.push.outputs.ref }}

    steps:
      - name: 🛰 Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: the secret scan reads commits, not just the working
          # tree, so a shallow clone would quietly narrow it to one commit.
          fetch-depth: 0

      - name: 🔍 Resolve & Verify Secrets
        run: |
          FINAL_KUBE="${{ secrets.PRODUCTION_KUBECONFIG }}"

          if [ -z "$FINAL_KUBE" ]; then
            echo "::error::PRODUCTION_KUBECONFIG is missing! Run 'larakube cloud:configure production --only=ci' locally."
            exit 1
          fi

          echo "✅ All secrets resolved successfully."

      # ── Phase 1: Security Audit (gates the build) ──────────────────────
      
      - name: 🔑 Gitleaks (secret gate)
        shell: bash
        run: |
          case "$(uname -m)" in aarch64|arm64) ARCH=arm64 ;; *) ARCH=x64 ;; esac
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_${ARCH}.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --exit-code=1 .

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 🧪 Dependency audit (NPM)
        run: npm audit --audit-level=critical

      - name: 🛡 Semgrep (SAST, ERROR-only gate)
        run: |
          # GitHub-hosted runners ship pip; the Forgejo job image (Debian) does not.
          python3 -m pip --version >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-pip; }
          python3 -m pip install --quiet --break-system-packages semgrep
          semgrep scan --config=auto --severity=ERROR --error

      
      - name: 📁 Trivy filesystem scan (non-blocking)
        shell: bash
        run: |
          case "$(uname -m)" in aarch64|arm64) ARCH=ARM64 ;; *) ARCH=64bit ;; esac
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-${ARCH}.tar.gz" | tar -xz -C /tmp trivy
          /tmp/trivy fs --quiet --ignore-unfixed --exit-code 0 .

      - name: 🛡 Create .env file (browser-bundle vars only)
        run: |
          touch .env

# ── Build & ship (Podman) ──────────────────────────────────────────
      - name: 🦭 Ensure the Podman client
        shell: bash
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends podman-remote
            ln -sf "$(command -v podman-remote)" /usr/local/bin/podman
          fi
          podman version

      - name: 🔐 Log in to Container Registry
        shell: bash
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_PASSWORD" | podman login -u "$REGISTRY_USER" --password-stdin "$REGISTRY_HOST"

      - name: 🐳 Build application image
        shell: bash
        run: |
          # Image references must be lowercase; repository names often are not.
          IMAGE="${REGISTRY_HOST}/${IMAGE_NAME,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          podman build --layers \
            --file Dockerfile.static \
            --secret id=dotenv,src=.env \
            --tag "$IMAGE:$GITHUB_SHA" \
            --tag "$IMAGE:latest" \
            .

      # ── Artifact security gate ─────────────────────────────────────────
      - name: 📦 Export image for scanning
        shell: bash
        run: podman save -o image.tar "$IMAGE:$GITHUB_SHA"

      - name: 🚦 Trivy image scan (CRITICAL gate)
        shell: bash
        run: |
          case "$(uname -m)" in aarch64|arm64) ARCH=ARM64 ;; *) ARCH=64bit ;; esac
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-${ARCH}.tar.gz" | tar -xz -C /tmp trivy
          /tmp/trivy image --quiet --input image.tar --ignore-unfixed --severity CRITICAL --exit-code 1

      # ── Ship (only if every gate cleared) ──────────────────────────────
      - name: 🚀 Push image
        id: push
        shell: bash
        run: |
          podman push --digestfile digest "$IMAGE:$GITHUB_SHA"
          podman push "$IMAGE:latest"
          echo "ref=$IMAGE@$(cat digest)" >> "$GITHUB_OUTPUT"

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
# ── Connect to the cluster ─────────────────────────────────────────
      - name: 🛰 Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: .infrastructure

      - name: 🔍 Resolve & Verify Secrets
        run: |
          FINAL_KUBE="${{ secrets.PRODUCTION_KUBECONFIG }}"

          if [ -z "$FINAL_KUBE" ]; then
            echo "::error::PRODUCTION_KUBECONFIG is missing! Run 'larakube cloud:configure production --only=ci' locally."
            exit 1
          fi

          echo "K_DATA<<EOF" >> $GITHUB_ENV
          echo "$FINAL_KUBE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 🕵️ Inspect Cluster Target
        shell: bash
        run: |
          TARGET_URL=$(echo "$K_DATA" | grep "server:" | awk '{print $2}')
          echo "🚀 Deployment Target Cluster: $TARGET_URL"

          if [[ "$TARGET_URL" == *"127.0.0.1"* ]] || [[ "$TARGET_URL" == *"localhost"* ]]; then
            echo "::error::🚨 FATAL: Kubeconfig is targeting LOCALHOST ($TARGET_URL)!"
            echo "::error::This usually happens if your local context was active during secret upload."
            echo "::error::FIX: Run 'larakube cloud:configure production --only=ci' again and ensure the CLI extracts your remote context."
            exit 1
          fi


      - name: 🔑 Set Kubernetes context
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ env.K_DATA }}

      - name: ☸️ Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: 🏗 Deploy
        run: |
          # Kustomize at the pushed digest. This runner holds a NAMESPACE-SCOPED
          # credential, so the cluster-scoped Namespace doc is stripped.
          cd .infrastructure/k8s/overlays/production
          kubectl kustomize . | sed "s|image: portfolio:production-latest|image: ${{ needs.build.outputs.image_ref }}|g" | awk 'function flush(){if(!drop&&doc!=""){printf "%s",doc} doc="";drop=0} /^---[ \t\r]*$/{flush();print;next} {doc=doc $0 "\n"; if($0 ~ /^kind:[ \t]+Namespace[ \t\r]*$/)drop=1} END{flush()}' | kubectl apply -f -

          kubectl rollout status deployment/web -n portfolio-production --timeout=300s
